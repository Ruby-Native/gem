# Ruby Native reads this file on launch to configure the native app.
# Edit and relaunch the native app to see changes.

# Configure how the app launches and navigates between pages.
# https://rubynative.com/docs/advanced-mode
app:
  # Navigation mode. Options:
  #   normal   - no screen transitions (default)
  #   advanced - Hotwire Native navigator with native transitions
  mode: normal

  # First URL shown when the app launches.
  # Default: the first tab's path.
  # entry_path: /inbox

# Configure the app's colors, theme, and orientation.
# https://rubynative.com/docs/appearance
appearance:
  # Color of interactive elements (links, buttons, tab selection).
  # Accepts a hex string, or { light:, dark: } for dark mode support.
  tint_color: "#007AFF"

  # Color shown briefly during launch and as the safe-area fill.
  # Accepts a hex string, or { light:, dark: } for dark mode support.
  background_color: "#FFFFFF"

  # Light/dark theme. Options:
  #   auto  - follows system setting (default)
  #   light - force light mode
  #   dark  - force dark mode
  # theme: auto

  # Enable device rotation.
  # Default: false (portrait-only).
  # landscape: true

  # Brand the navigation bar across the whole app: a centered logo in place of
  # the page title, plus your own bar colors.
  # https://rubynative.com/docs/appearance#navbar-branding
  # navbar:
  #   # Centered logo, shown instead of the page title. Set this to an image URL.
  #   # For a local asset, point it at image_url wrapped in ERB so the URL is
  #   # fingerprinted (the app re-downloads only when the image changes). The
  #   # docs page above has the exact snippet to copy.
  #   logo: "https://cdn.example.com/logo.png"
  #
  #   # Bar background color.
  #   # Accepts a hex string, or { light:, dark: } for dark mode support.
  #   background_color: "#3B3F54"
  #
  #   # Title and bar-button color.
  #   # Accepts a hex string, or { light:, dark: } for dark mode support.
  #   foreground_color: "#FFFFFF"
  #
  #   # Status bar content, to match your bar. Options: light (white) or dark.
  #   # Omit to let the system decide.
  #   status_bar: light

  # Show a launch splash while the first screen loads. It holds your launch icon
  # and background_color in frame, with a spinner, until the web content paints.
  # Off by default; set enabled: true to turn it on.
  # https://rubynative.com/docs/appearance#splash-screen
  # splash:
  #   enabled: true
  #
  #   # Spinner color. Accepts a hex string, or { light:, dark: } for dark mode.
  #   # Defaults to a contrast-aware pick from your background_color.
  #   spinner_color: "#007AFF"
  #
  #   # Status bar content over the splash. Options: light (white) or dark.
  #   # Defaults to a contrast-aware pick from your background_color.
  #   status_bar: dark

# Configure the native tab bar on the bottom of the screen.
# https://rubynative.com/docs/tabs
tabs:
  # Icons are SF Symbols on iOS and Material Icons on Android.
  # https://rubynative.com/docs/icons
  - title: Home
    path: /
    icon: house
  - title: Profile
    path: /profile
    icon: person

  # Per-tab options (add to any tab above):
  #
  #   # Load this tab on launch instead of lazily.
  #   # Default: false.
  #   eager: true
  #
  #   # Show a search field in the navigation bar.
  #   # Default: false.
  #   search: true
  #
  #   # Allow this tab to show a notification badge.
  #   # Default: false.
  #   badge: true
  #
  #   # Routes that switch to this tab. Options:
  #   #   false           - never auto-switch
  #   #   [/orders/, /a/] - switch when visiting these path prefixes
  #   # Default: routes matching the tab's path prefix.
  #   auto_route: [/orders/]

# Link your domain to the app to share passwords from your site. Also,
# tapping a link to your site opens in the app instead of the browser.
# https://rubynative.com/docs/linked-domains
# ios:
#   bundle_id: com.example.myapp
#   team_id: ABCD123456
# android:
#   package: com.example.myapp
#   # Play Console -> Setup -> App integrity -> App signing key certificate.
#   cert_fingerprint: "AA:BB:CC:..."

# Enable OAuth. Each path triggers a native ASWebAuthenticationSession
# on iOS instead of an in-app web view. List only the authorize path for each
# provider, not its callback; the callback is handled automatically.
# https://rubynative.com/docs/oauth
# auth:
#   oauth_paths:
#     - /auth/google
#     - /auth/github
